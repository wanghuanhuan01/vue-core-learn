<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>vue-demo</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
<div>
    123
    <p>{{name}}</p>
</div>
<script>
    let vm = new Vue({
        data: {
            a: 1,
            b: 2,
            person:{
                name:'zs'
            }
        },
        watch: { // 2号watcher
            x() {
                console.log('x监听')
            }
        },
        computed: { // 1号watcher
            x() {
                console.log('x计算')
                return JSON.stringify(this.person)
            }
        },
    })
    vm.person = {name:'ls'}
</script>
</body>
</html>
